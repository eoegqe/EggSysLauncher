plugins { id 'com.android.application' }
android {
    namespace 'com.theegget.eggsys'
    compileSdk 35
    defaultConfig {
        applicationId "com.theegget.eggsys"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
